kind = "web"
previewPath = "/"
title = "Vawulence City Media"
version = "1.0.0"
id = "artifacts/vcm"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23544

[services.development]
run = "pnpm --filter @workspace/vcm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vcm", "run", "build" ]
publicDir = "artifacts/vcm/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23544"
BASE_PATH = "/"
